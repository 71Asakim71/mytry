<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简记账 · Asakim</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fb;
      color: #1e2b4f;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: #6b7b9e; margin-top: 0.4rem; font-size: 0.95rem; }
    .back-link {
      display: inline-block; margin-bottom: 1rem; color: #6b7b9e;
      text-decoration: none; font-size: 0.9rem;
    }
    .back-link:hover { color: #1e2b4f; }

    .card {
      background: white; border-radius: 20px; padding: 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      border: 1px solid #e6ecf5; margin-bottom: 1.5rem;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;}
    .card-title { font-size: 1.1rem; font-weight: 600; }

    /* 账本导航栏 */
    .ledger-nav {
      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; position: relative;
    }
    .select-box {
      border: 1px solid #e6ecf5; background: #f9fbfe; border-radius: 12px;
      padding: 0.45rem 0.8rem; font-family: inherit; font-size: 0.9rem;
      color: #1e2b4f; outline: none; cursor: pointer; transition: all 0.2s;
    }
    .select-box:hover { background: #edf2fa; border-color: #b7c9e8; }

    /* 数据下拉菜单 */
    .dropdown { position: relative; display: inline-block; margin-left: auto; }
    .dropdown-menu {
      display: none; position: absolute; right: 0; top: 100%; margin-top: 0.5rem;
      background: white; border: 1px solid #e6ecf5; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); z-index: 100; min-width: 160px; overflow: hidden;
    }
    .dropdown-menu.show { display: block; animation: fadeIn 0.15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .dropdown-item {
      display: block; width: 100%; padding: 0.7rem 1rem; text-align: left;
      border: none; background: transparent; cursor: pointer; font-family: inherit;
      font-size: 0.85rem; color: #1e2b4f; transition: background 0.2s;
    }
    .dropdown-item:hover { background: #f5f7fb; }

    /* 工具栏 */
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
    .btn {
      border: 1px solid #e6ecf5; background: #f9fbfe; color: #1e2b4f;
      border-radius: 12px; padding: 0.35rem 0.75rem; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s ease; font-family: inherit;
      display: flex; align-items: center; gap: 0.3rem; white-space: nowrap;
    }
    .btn:hover { background: #edf2fa; border-color: #b7c9e8; }
    .btn-primary { background: #1e2b4f; color: white; border-color: #1e2b4f; }
    .btn-danger { background: #fdf0ef; color: #c0392b; border-color: #e8c4c0; }
    .btn-danger:hover { background: #fbe4e2; }
    
    /* 模式按钮 */
    .btn-mode-active { background: #1e2b4f; color: white; border-color: #1e2b4f; }
    .btn-del-active { background: #fdf0ef; color: #c0392b; border-color: #e8c4c0; }
    .btn-sort-active { background: #e0f2fe; color: #0284c7; border-color: #bae6fd; }

    /* Emoji 快捷面板 */
    .emoji-panel { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; min-height: 30px; }
    .emoji-chip {
      border: 1px solid #e6ecf5; background: white; border-radius: 10px;
      padding: 0.3rem 0.55rem; font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s ease; font-family: inherit; color: #1e2b4f;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .emoji-chip:hover { background: #edf2fa; border-color: #b7c9e8; }
    
    /* 删除模式下的 Emoji 标签 */
    .emoji-chip.delete-mode { border-color: #e8c4c0; background: #fdf0ef; color: #c0392b; cursor: crosshair; }
    .emoji-chip.delete-mode:hover { background: #fbe4e2; }
    .emoji-chip .del-x { font-size: 0.7rem; opacity: 0.6; }

    /* 表格 */
    .table-wrap { overflow-x: auto; margin-bottom: 1rem; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; table-layout: auto; }
    
    th, td { 
      padding: 0.6rem 0.4rem; 
      border-bottom: 1px solid #eef2f8; 
      text-align: left; 
      vertical-align: middle; 
      font-size: 0.9rem; 
      word-break: break-word; 
      position: relative;
      min-width: 50px;
    }
    
    th { font-weight: 600; font-size: 0.85rem; color: #6b7b9e; padding-bottom: 0.6rem; }
    
    /* 单元格 */
    td[contenteditable="true"] { outline: none; border-radius: 8px; transition: background 0.15s ease; padding: 4px; }
    td[contenteditable="true"]:focus { background: #f0f4fb; }
    td[contenteditable="false"] { cursor: default; }
    
    /* 自动计算的金额列样式 */
    td.auto-amount { color: #6b7b9e; font-weight: 500; background: #f9fbfe; }

    /* 操作列 */
    .action-col { width: 60px; padding: 4px 0; text-align: center; }
    
    /* 展开/收起按钮 */
    .btn-toggle {
      background: transparent; border: none; color: #6b7b9e; cursor: pointer;
      font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; transition: background 0.2s;
    }
    .btn-toggle:hover { background: #edf2fa; color: #1e2b4f; }

    /* 删除按钮 */
    .action-btn-del {
      border: none; background: transparent; color: #c0392b; cursor: pointer;
      font-size: 1.1rem; padding: 0.2rem; line-height: 1;
      border-radius: 50%;
    }
    .action-btn-del:hover { background: #fdf0ef; }

    /* 排序按钮 */
    .sort-controls { display: flex; gap: 4px; justify-content: center; }
    .btn-sort {
      background: #f9fbfe; border: 1px solid #e6ecf5; border-radius: 4px;
      color: #1e2b4f; cursor: pointer; padding: 2px 6px; font-size: 1rem;
    }
    .btn-sort:hover:not(:disabled) { background: #edf2fa; border-color: #b7c9e8; }
    .btn-sort:disabled { opacity: 0.3; cursor: not-allowed; }

    /* 表头列删除 */
    .col-del-btn {
      color: #c0392b; background: #fdf0ef; border: none; border-radius: 4px;
      font-size: 0.7rem; cursor: pointer; padding: 2px 5px;
      margin-left: 4px; vertical-align: middle; display: inline-block;
    }

    /* ===== 子账单（明细）专属样式 ===== */
    .child-row { background: #fafbfc; }
    .child-row td { border-bottom: 1px dashed #eef2f8; }
    .tree-indent { color: #b7c9e8; padding-right: 4px; user-select: none; }
    
    .add-child-row td { text-align: left; border-bottom: 1px solid #eef2f8; }
    .btn-text-add {
      background: transparent; border: none; color: #6b7b9e; font-size: 0.8rem;
      cursor: pointer; padding: 4px 8px; border-radius: 4px;
    }
    .btn-text-add:hover { color: #1e2b4f; background: #edf2fa; }

    /* 日期选择器样式 */
    .child-date-input {
      border: 1px solid transparent; border-radius: 6px; padding: 4px;
      font-family: inherit; font-size: 0.85rem; color: #1e2b4f;
      background: transparent; width: 100%; min-width: 110px;
    }
    .child-date-input:focus { background: #f0f4fb; border-color: #b7c9e8; outline: none; }
    .child-date-input:disabled { color: #9aaac9; }

    /* 总计 */
    .total-bar {
      display: flex; justify-content: flex-end; align-items: baseline; gap: 0.6rem;
      padding-top: 0.8rem; border-top: 2px solid #eef2f8; font-size: 1rem;
    }
    .total-amount { font-size: 1.4rem; font-weight: 700; color: #1e2b4f; }
    .empty-hint { color: #9aaac9; font-size: 0.9rem; text-align: center; padding: 2rem 0; }
    footer { text-align: center; margin-top: 2rem; color: #9aaac9; font-size: 0.85rem; }

    /* ===== 弹窗通用 ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 43, 79, 0.4); backdrop-filter: blur(2px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: white; border-radius: 20px; padding: 1.5rem;
      width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-title { font-size: 1.2rem; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #9aaac9; }

    /* ===== 原生 CSS 图表样式 ===== */
    .css-chart { margin-bottom: 1.5rem; }
    .chart-row { margin-bottom: 0.8rem; }
    .chart-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.3rem; color: #1e2b4f;}
    .chart-track { background: #f0f4fb; height: 12px; border-radius: 6px; overflow: hidden; }
    .chart-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease-out; }

    /* 报表明细列表 */
    .report-list-title { font-size: 0.9rem; color: #6b7b9e; margin-bottom: 0.5rem; border-bottom: 1px dashed #eef2f8; padding-bottom: 0.5rem;}
    .report-item { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid #f5f7fb; font-size: 0.9rem;}
    .report-item:last-child { border-bottom: none; }
    .report-total { font-size: 1.2rem; font-weight: 700; color: #1e2b4f; text-align: right; margin-top: 1rem; padding-top: 1rem; border-top: 2px solid #eef2f8;}

    /* 导出/导入弹窗专用 */
    .export-btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .export-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #1e2b4f; color: white; text-decoration: none;
      padding: 0.8rem; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; width: 100%;
      transition: opacity 0.2s;
    }
    .export-btn:active { opacity: 0.8; }
    .export-btn.secondary { background: #5b8ff9; }
    .export-btn.outline { background: white; border: 1px solid #e6ecf5; color: #1e2b4f; }
    .export-tip { font-size: 0.8rem; color: #9aaac9; line-height: 1.5; text-align: left; background: #f9fbfe; padding: 10px; border-radius: 8px;}
    
    /* 导入文本框 */
    .import-textarea {
      width: 100%; height: 150px; padding: 10px; border: 1px solid #e6ecf5;
      border-radius: 12px; font-family: monospace; font-size: 0.8rem;
      background: #f9fbfe; color: #1e2b4f; resize: vertical; margin-bottom: 15px; outline: none;
    }
    .import-textarea:focus { border-color: #b7c9e8; background: white; }

    /* ===== 手机端适配 ===== */
    @media (max-width: 600px) {
      body { padding: 1rem 0.5rem; }
      .card { padding: 1rem; border-radius: 16px; }
      .toolbar > span[style*="flex:1"] { display: none; }
      .toolbar { gap: 0.4rem; }
      .btn { padding: 0.35rem 0.5rem; font-size: 0.8rem; }
      .select-box { padding: 0.4rem 0.5rem; font-size: 0.8rem; }
      th, td { padding: 0.5rem 0.3rem; font-size: 0.85rem; }
      
      /* 固定第一列 */
      th:first-child, td:first-child {
        position: sticky; left: 0; background: white; z-index: 2;
        box-shadow: 2px 0 4px -2px rgba(0,0,0,0.05);
      }
      th:first-child { z-index: 3; }
      .child-row td:first-child { background: #fafbfc; }
    }
  </style>
</head>
<body>
<div class="container">
  <a class="back-link" href="../">← 返回工具箱</a>
  <header>
    <h1>📒 极简记账</h1>
    <p>支持分项记录，自动汇总计算</p>
  </header>

  <!-- 账本导航 -->
  <div class="card">
    <div class="ledger-nav">
      <select id="yearSelect" class="select-box"></select>
      <select id="monthSelect" class="select-box"></select>
      <button class="btn" id="addYearBtn">＋ 年</button>
      <button class="btn btn-danger" id="delYearBtn">✕ 删年</button>
      <button class="btn" id="addMonthBtn">＋ 月</button>
      <button class="btn btn-danger" id="delMonthBtn">✕ 删月</button>
      
      <!-- 数据工具下拉菜单 -->
      <div class="dropdown">
        <button class="btn" id="dataToolBtn">📊 数据工具 ▾</button>
        <div class="dropdown-menu" id="dataToolMenu">
          <button class="dropdown-item" id="exportDataBtn">📤 导出与备份</button>
          <button class="dropdown-item" id="importDataBtn">📥 导入数据 (恢复)</button>
          <button class="dropdown-item" id="monthReportBtn">📈 生成月报表</button>
          <button class="dropdown-item" id="yearReportBtn">📅 生成年报表</button>
        </div>
      </div>

      <button class="btn" id="undoLedgerBtn" style="display:none; margin-left: 10px; color: #c0392b; background: #fdf0ef;">↩️ 撤销删账本</button>
    </div>
  </div>

  <!-- 分类面板 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">🍽️ 分类快捷填入</div>
      <div class="toolbar" style="margin-bottom: 0;">
        <button class="btn" id="addEmojiBtn">＋ 标签</button>
        <button class="btn btn-danger" id="toggleDelEmojiBtn">✕ 删标签</button>
        <button class="btn" id="undoEmojiBtn" style="display:none;">↩️ 撤销</button>
      </div>
    </div>
    <div class="emoji-panel" id="emojiPanel"></div>
  </div>

  <!-- 账目表格 -->
  <div class="card">
    <div class="toolbar">
      <button class="btn btn-mode-active" id="modeEditBtn">✏️ 记账模式</button>
      <button class="btn" id="modeDelBtn">🗑️ 删除模式</button>
      <button class="btn" id="modeSortBtn">🔃 排序模式</button>
      
      <button class="btn" id="undoRowBtn" style="display:none; margin-left: 10px;">↩️ 撤销</button>
      <span style="flex:1"></span>
      <button class="btn btn-primary" id="addRowBtn">＋ 行</button>
      <button class="btn" id="addColBtn">＋ 列</button>
      <button class="btn btn-danger" id="clearBtn">清空</button>
    </div>
    <div class="table-wrap">
      <table id="ledgerTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="total-bar">
      <span style="color:#6b7b9e;">本月总计</span>
      <span class="total-amount" id="totalDisplay">0</span>
    </div>
  </div>

  <footer>数据保存在本机浏览器中 · Asakim 工具箱</footer>
</div>

<!-- 报表弹窗 -->
<div class="modal-overlay" id="reportModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">报表</div>
      <button class="modal-close" id="closeModalBtn">×</button>
    </div>
    
    <!-- 纯 CSS 图表渲染区 -->
    <div id="cssChartContainer" class="css-chart"></div>
    
    <div class="report-list-title">详细数据</div>
    <div id="reportBody"></div>
  </div>
</div>

<!-- 导出与备份弹窗 -->
<div class="modal-overlay" id="exportModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">📤 导出与备份</div>
      <button class="modal-close" id="closeExportBtn">×</button>
    </div>
    
    <div class="export-btn-group">
      <button id="copyTableBtn" class="export-btn">📊 复制为表格 (直接粘贴进 Excel)</button>
      <button id="copyJsonBtn" class="export-btn secondary">📝 复制纯文本备份 (JSON格式)</button>
    </div>
    
    <div class="export-tip">
      <strong>💡 怎么用？</strong><br>
      1. 点击上方“复制为表格”。<br>
      2. 打开电脑或手机的 Excel / WPS / 备忘录。<br>
      3. 找个空白格，直接“粘贴”，表格就完美生成了！<br>
      <br>
      <em>（复制 JSON 备份适合保存在备忘录里，以后换手机或误删时，可以用“导入数据”恢复。）</em>
    </div>
  </div>
</div>

<!-- 导入弹窗 -->
<div class="modal-overlay" id="importModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">📥 导入与恢复</div>
      <button class="modal-close" id="closeImportBtn">×</button>
    </div>
    
    <div class="export-tip" style="margin-bottom: 15px; color: #c0392b; background: #fdf0ef; border: 1px solid #e8c4c0;">
      <strong>⚠️ 警告：</strong>导入数据将会覆盖你当前浏览器里所有的账目数据！请确保你粘贴的是正确的备份文本。
    </div>
    
    <textarea id="importTextarea" class="import-textarea" placeholder="请在此处粘贴之前复制的 JSON 备份文本..."></textarea>
    
    <button id="confirmImportBtn" class="export-btn">确认导入并覆盖当前数据</button>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'asakim_ledger_v3';
  
  // 莫兰迪色系，用于图表
  const COLORS = [
    '#5b8ff9', '#5ad8a6', '#5d7092', '#f6bd16', '#e8684a',
    '#6dc8ec', '#9270ca', '#ff9d4d', '#269a99', '#ff99c3'
  ];

  const DEFAULT_LEDGER_DATA = {
    columns: ['日期', '分类', '名称', '金额'],
    rows: [
      { cells: ['', '🍚 早餐', '豆浆油条', '8'], children: [], isExpanded: false },
      { cells: ['', '🍜 午餐', '牛肉面', '22'], children: [], isExpanded: false }
    ]
  };

  const DEFAULT_EMOJIS = [
    '🍚 早餐', '🍜 午餐', '🍽️ 晚餐', '🧋 奶茶', '☕ 咖啡',
    '🚌 交通', '🛒 购物', '🏠 房租', '💡 水电', '📱 话费',
    '🎮 游戏', '📚 书籍', '💊 医疗', '🎁 礼物', '✈️ 旅行'
  ];

  function getTodayStr() {
    const today = new Date();
    return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  }

  function getInitState() {
    const today = new Date();
    const y = today.getFullYear();
    const m = today.getMonth() + 1;
    return {
      currentYear: y,
      currentMonth: m,
      emojis: [...DEFAULT_EMOJIS],
      years: {
        [y]: {
          [m]: JSON.parse(JSON.stringify(DEFAULT_LEDGER_DATA))
        }
      }
    };
  }

  let state = load();
  let currentMode = 'edit'; 
  let isDelEmojiMode = false;
  let deletedRowDataStack = []; 
  let deletedLedgerData = null; 
  let deletedEmojiDataStack = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.currentYear && parsed.years) {
          if (!parsed.emojis) parsed.emojis = [...DEFAULT_EMOJIS];
          return parsed;
        }
      }
    } catch (e) {}
    
    try {
      const oldRaw = localStorage.getItem('asakim_ledger_v2');
      if (oldRaw) {
        const oldParsed = JSON.parse(oldRaw);
        if (oldParsed.columns && oldParsed.rows) {
           const init = getInitState();
           init.years[init.currentYear][init.currentMonth] = oldParsed;
           return init;
        }
      }
    } catch(e) {}

    return getInitState();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getLedger() {
    const y = state.currentYear;
    const m = state.currentMonth;
    if (!state.years[y]) state.years[y] = {};
    if (!state.years[y][m]) {
      state.years[y][m] = JSON.parse(JSON.stringify(DEFAULT_LEDGER_DATA));
    }
    return state.years[y][m];
  }

  function render() {
    renderNav();
    renderHead();
    renderBody();
    renderTotal();
    renderEmojiPanel();
    updateToolbar();
  }

  function renderNav() {
    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    
    yearSelect.innerHTML = '';
    if (!state.years[state.currentYear]) state.years[state.currentYear] = {};
    
    const years = Object.keys(state.years).sort((a,b) => b - a);
    if (!years.includes(state.currentYear.toString())) {
      years.push(state.currentYear.toString());
      years.sort((a,b) => b - a);
    }

    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y + ' 年';
      if (parseInt(y) === state.currentYear) opt.selected = true;
      yearSelect.appendChild(opt);
    });

    monthSelect.innerHTML = '';
    for (let i = 1; i <= 12; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i + ' 月';
      if (i === state.currentMonth) opt.selected = true;
      monthSelect.appendChild(opt);
    }

    document.getElementById('undoLedgerBtn').style.display = deletedLedgerData ? 'inline-block' : 'none';
  }

  function updateToolbar() {
    const modeEditBtn = document.getElementById('modeEditBtn');
    const modeDelBtn = document.getElementById('modeDelBtn');
    const modeSortBtn = document.getElementById('modeSortBtn');
    const undoRowBtn = document.getElementById('undoRowBtn');
    
    modeEditBtn.className = currentMode === 'edit' ? 'btn btn-mode-active' : 'btn';
    modeDelBtn.className = currentMode === 'delete' ? 'btn btn-del-active' : 'btn';
    modeSortBtn.className = currentMode === 'sort' ? 'btn btn-sort-active' : 'btn';

    if (currentMode === 'delete' && deletedRowDataStack.length > 0) {
      undoRowBtn.style.display = 'flex';
      const lastAction = deletedRowDataStack[deletedRowDataStack.length - 1];
      const actionName = lastAction.type === 'parent' ? '删大类' : '删明细';
      undoRowBtn.innerHTML = `↩️ 撤销${actionName} (${deletedRowDataStack.length})`;
    } else {
      undoRowBtn.style.display = 'none';
    }
    
    const delEmojiBtn = document.getElementById('toggleDelEmojiBtn');
    const undoEmojiBtn = document.getElementById('undoEmojiBtn');
    if (isDelEmojiMode) {
      delEmojiBtn.innerHTML = '✕ 取消删标签';
      delEmojiBtn.className = 'btn btn-mode-active';
      if (deletedEmojiDataStack.length > 0) {
        undoEmojiBtn.style.display = 'flex';
        undoEmojiBtn.innerHTML = `↩️ 撤销 (${deletedEmojiDataStack.length})`;
      } else {
        undoEmojiBtn.style.display = 'none';
      }
    } else {
      delEmojiBtn.innerHTML = '✕ 删标签';
      delEmojiBtn.className = 'btn btn-danger';
      undoEmojiBtn.style.display = 'none';
    }
  }

  function amountColumnIndex(ledger) {
    const targetLedger = ledger || getLedger();
    const idx = targetLedger.columns.findIndex(c => c.includes('金额'));
    return idx >= 0 ? idx : targetLedger.columns.length - 1;
  }

  function getRowAmount(row, amtIdx) {
    if (row.children && row.children.length > 0) {
      let sum = 0;
      row.children.forEach(c => {
        let val = parseFloat(c.cells[amtIdx]);
        if (!isNaN(val)) sum += val;
      });
      return sum;
    } else {
      let val = parseFloat(row.cells[amtIdx]);
      return isNaN(val) ? 0 : val;
    }
  }

  function renderTotal() {
    const ledger = getLedger();
    const idx = amountColumnIndex(ledger);
    let sum = 0;
    ledger.rows.forEach(row => {
      sum += getRowAmount(row, idx);
    });
    document.getElementById('totalDisplay').textContent =
      sum % 1 === 0 ? sum.toString() : sum.toFixed(2);
  }

  function updateParentAmountDisplay(ri) {
    const ledger = getLedger();
    const row = ledger.rows[ri];
    const amtIdx = amountColumnIndex(ledger);
    const autoSum = getRowAmount(row, amtIdx);
    
    const tbody = document.getElementById('tableBody');
    const parentTrs = Array.from(tbody.children).filter(tr => !tr.classList.contains('child-row'));
    const currentTr = parentTrs[ri];
    
    if (currentTr) {
      const amountTd = currentTr.children[amtIdx];
      if (amountTd) {
        amountTd.textContent = autoSum % 1 === 0 ? autoSum.toString() : autoSum.toFixed(2);
      }
    }
  }

  function renderEmojiPanel() {
    const panel = document.getElementById('emojiPanel');
    panel.innerHTML = '';
    state.emojis.forEach((text, index) => {
      const chip = document.createElement('button');
      chip.className = 'emoji-chip' + (isDelEmojiMode ? ' delete-mode' : '');
      
      if (isDelEmojiMode) {
        chip.innerHTML = `<span>${text}</span><span class="del-x">✕</span>`;
        chip.addEventListener('click', function() {
          if (!confirm(`确定要删除标签【${text}】吗？`)) return;
          deletedEmojiDataStack.push({ index: index, text: text });
          if (deletedEmojiDataStack.length > 3) deletedEmojiDataStack.shift();
          state.emojis.splice(index, 1);
          save(); render();
        });
      } else {
        chip.textContent = text;
        chip.addEventListener('click', function() {
          if (currentMode !== 'edit') return alert('请先切换到记账模式');
          const active = window._activeCell;
          if (active && active.el) {
            active.el.textContent = text;
            const ledger = getLedger();
            if (active.isChild) {
              ledger.rows[active.ri].children[active.cIdx].cells[active.ci] = text;
              if (active.ci === amountColumnIndex(ledger)) {
                updateParentAmountDisplay(active.ri);
                renderTotal();
              }
            } else {
              ledger.rows[active.ri].cells[active.ci] = text;
              renderTotal();
            }
            save();
          } else {
            alert('请先点击表格中的一个单元格，再选择分类。');
          }
        });
      }
      panel.appendChild(chip);
    });
  }

  function renderHead() {
    const ledger = getLedger();
    const thead = document.getElementById('tableHead');
    thead.innerHTML = '';
    const tr = document.createElement('tr');
    
    ledger.columns.forEach((col, ci) => {
      const th = document.createElement('th');
      
      if (currentMode === 'edit') {
        th.textContent = col;
        th.setAttribute('contenteditable', 'true');
        th.style.outline = 'none';
        th.addEventListener('input', function() {
          ledger.columns[ci] = this.textContent;
          save();
        });
        th.addEventListener('blur', function() {
          if (this.textContent.trim() === '') {
            this.textContent = '未命名';
            ledger.columns[ci] = '未命名';
          } else {
            ledger.columns[ci] = this.textContent.trim();
          }
          save(); renderTotal();
        });
      } else if (currentMode === 'delete') {
        th.style.cursor = 'default';
        const textSpan = document.createElement('span');
        textSpan.textContent = col;
        textSpan.style.display = 'inline-block';
        th.appendChild(textSpan);
        
        const colDelBtn = document.createElement('button');
        colDelBtn.className = 'col-del-btn';
        colDelBtn.textContent = '✕';
        colDelBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if(!confirm('确定删除此列吗？')) return;
          ledger.columns.splice(ci, 1);
          ledger.rows.forEach(r => {
            r.cells.splice(ci, 1);
            if (r.children) r.children.forEach(c => c.cells.splice(ci, 1));
          });
          save(); render();
        });
        th.appendChild(colDelBtn);
      } else {
        th.textContent = col;
        th.setAttribute('contenteditable', 'false');
        th.style.cursor = 'default';
      }
      tr.appendChild(th);
    });
    
    const thOp = document.createElement('th');
    thOp.className = 'action-col';
    if (currentMode === 'sort') thOp.textContent = '上下移';
    tr.appendChild(thOp);
    thead.appendChild(tr);
  }

  function renderBody() {
    const ledger = getLedger();
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    if (ledger.rows.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = ledger.columns.length + 1;
      td.className = 'empty-hint';
      td.textContent = '本月还没有账目，点击上方「＋ 行」开始记录。';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    const amtIdx = amountColumnIndex(ledger);
    const dateColIdx = ledger.columns.findIndex(c => c.includes('日期'));
    const todayStr = getTodayStr();

    ledger.rows.forEach((row, ri) => {
      const tr = document.createElement('tr');
      while (row.cells.length < ledger.columns.length) row.cells.push('');

      const hasChildren = row.children && row.children.length > 0;
      const autoSum = hasChildren ? getRowAmount(row, amtIdx) : 0;

      row.cells.forEach((cellVal, ci) => {
        const td = document.createElement('td');
        const isAutoAmount = (ci === amtIdx && hasChildren);
        
        if (currentMode === 'edit' && !isAutoAmount) {
          td.setAttribute('contenteditable', 'true');
          td.addEventListener('input', function() {
            row.cells[ci] = this.textContent;
            save();
            if (ci === amtIdx) renderTotal();
          });
          td.addEventListener('click', function() {
            window._activeCell = { ri, ci, el: this, isChild: false };
          });
        } else {
          td.setAttribute('contenteditable', 'false');
        }
        
        if (isAutoAmount) {
          td.textContent = autoSum % 1 === 0 ? autoSum.toString() : autoSum.toFixed(2);
          td.className = 'auto-amount';
        } else {
          td.textContent = cellVal;
        }
        
        tr.appendChild(td);
      });

      const tdOp = document.createElement('td');
      tdOp.className = 'action-col';
      
      if (currentMode === 'edit') {
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'btn-toggle';
        toggleBtn.textContent = row.isExpanded ? '▼' : '▶';
        toggleBtn.addEventListener('click', function() {
          row.isExpanded = !row.isExpanded;
          save(); render();
        });
        tdOp.appendChild(toggleBtn);
      } else if (currentMode === 'delete') {
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn-del';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => {
          deletedRowDataStack.push({ type: 'parent', parentIndex: ri, data: JSON.parse(JSON.stringify(row)) });
          if (deletedRowDataStack.length > 3) deletedRowDataStack.shift();
          ledger.rows.splice(ri, 1);
          save(); render();
        });
        tdOp.appendChild(delBtn);
      } else if (currentMode === 'sort') {
        const ctrlWrap = document.createElement('div');
        ctrlWrap.className = 'sort-controls';
        
        const upBtn = document.createElement('button');
        upBtn.className = 'btn-sort';
        upBtn.textContent = '↑';
        upBtn.disabled = (ri === 0);
        upBtn.addEventListener('click', () => moveRow(ri, -1));
        
        const downBtn = document.createElement('button');
        downBtn.className = 'btn-sort';
        downBtn.textContent = '↓';
        downBtn.disabled = (ri === ledger.rows.length - 1);
        downBtn.addEventListener('click', () => moveRow(ri, 1));
        
        ctrlWrap.appendChild(upBtn);
        ctrlWrap.appendChild(downBtn);
        tdOp.appendChild(ctrlWrap);
      }

      tr.appendChild(tdOp);
      tbody.appendChild(tr);

      if (currentMode !== 'sort' && row.isExpanded) {
        if (dateColIdx > -1 && row.children.length > 1) {
          row.children.sort((a, b) => {
            let d1 = a.cells[dateColIdx] || '';
            let d2 = b.cells[dateColIdx] || '';
            return d2.localeCompare(d1);
          });
        }

        row.children.forEach((child, cIdx) => {
          const childTr = document.createElement('tr');
          childTr.className = 'child-row';
          while (child.cells.length < ledger.columns.length) child.cells.push('');

          ledger.columns.forEach((col, ci) => {
            const childTd = document.createElement('td');
            
            if (ci === 0) {
              childTd.innerHTML = '<span class="tree-indent">└</span>';
            } else if (ci === dateColIdx) {
              const dateInput = document.createElement('input');
              dateInput.type = 'date';
              dateInput.className = 'child-date-input';
              dateInput.value = child.cells[ci] || todayStr;
              if (!child.cells[ci]) child.cells[ci] = todayStr;
              
              if (currentMode !== 'edit') {
                dateInput.disabled = true;
              } else {
                dateInput.addEventListener('change', function() {
                  child.cells[ci] = this.value;
                  save();
                  render(); 
                });
              }
              childTd.appendChild(dateInput);
            } else {
              childTd.textContent = child.cells[ci] || '';
              if (currentMode === 'edit') {
                childTd.setAttribute('contenteditable', 'true');
                childTd.addEventListener('input', function() {
                  child.cells[ci] = this.textContent;
                  save();
                  if (ci === amtIdx) {
                    updateParentAmountDisplay(ri);
                    renderTotal();
                  }
                });
                childTd.addEventListener('click', function() {
                  window._activeCell = { ri, ci, el: this, isChild: true, cIdx };
                });
              } else {
                childTd.setAttribute('contenteditable', 'false');
              }
            }
            childTr.appendChild(childTd);
          });

          const childOp = document.createElement('td');
          childOp.className = 'action-col';
          if (currentMode === 'delete') {
            const delChild = document.createElement('button');
            delChild.className = 'action-btn-del';
            delChild.textContent = '✕';
            delChild.addEventListener('click', () => {
              deletedRowDataStack.push({ type: 'child', parentIndex: ri, childIndex: cIdx, data: JSON.parse(JSON.stringify(child)) });
              if (deletedRowDataStack.length > 3) deletedRowDataStack.shift();
              row.children.splice(cIdx, 1);
              save(); render();
            });
            childOp.appendChild(delChild);
          }
          childTr.appendChild(childOp);
          tbody.appendChild(childTr);
        });

        if (currentMode === 'edit') {
          const addTr = document.createElement('tr');
          addTr.className = 'child-row add-child-row';
          const addTd = document.createElement('td');
          addTd.colSpan = ledger.columns.length + 1;
          
          const addBtn = document.createElement('button');
          addBtn.className = 'btn-text-add';
          addBtn.textContent = '＋ 添加明细';
          addBtn.addEventListener('click', () => {
            const emptyCells = new Array(ledger.columns.length).fill('');
            row.children.push({ cells: emptyCells });
            save(); render();
          });
          
          addTd.appendChild(addBtn);
          addTr.appendChild(addTd);
          tbody.appendChild(addTr);
        }
      }
    });
  }

  function moveRow(index, direction) {
    const ledger = getLedger();
    const targetIndex = index + direction;
    if (targetIndex < 0 || targetIndex >= ledger.rows.length) return;
    const temp = ledger.rows[index];
    ledger.rows[index] = ledger.rows[targetIndex];
    ledger.rows[targetIndex] = temp;
    save(); render();
  }

  document.getElementById('yearSelect').addEventListener('change', function() {
    state.currentYear = parseInt(this.value);
    deletedRowDataStack = []; deletedLedgerData = null; 
    save(); render();
  });

  document.getElementById('monthSelect').addEventListener('change', function() {
    state.currentMonth = parseInt(this.value);
    deletedRowDataStack = []; deletedLedgerData = null;
    save(); render();
  });

  document.getElementById('addYearBtn').addEventListener('click', function() {
    const y = prompt('请输入要添加的年份 (如 2024):', new Date().getFullYear() + 1);
    if (!y || isNaN(y)) return;
    const yearNum = parseInt(y);
    if (!state.years[yearNum]) state.years[yearNum] = {};
    state.currentYear = yearNum;
    save(); render();
  });

  document.getElementById('addMonthBtn').addEventListener('click', function() {
    const m = prompt('请输入要添加的月份 (1-12):', new Date().getMonth() + 1);
    if (!m || isNaN(m)) return;
    const monthNum = parseInt(m);
    if (monthNum < 1 || monthNum > 12) return alert('请输入 1-12 之间的数字');
    if (!state.years[state.currentYear][monthNum]) state.years[state.currentYear][monthNum] = {};
    state.currentMonth = monthNum;
    save(); render();
  });

  document.getElementById('delYearBtn').addEventListener('click', function() {
    const y = state.currentYear;
    if (Object.keys(state.years).length <= 1) return alert('至少要保留一个年份');
    if (!confirm(`确定要删除 ${y} 年的所有账本吗？`)) return;
    if (!confirm(`【二次确认】删除后该年份下所有数据将清空，确定继续吗？`)) return;
    
    deletedLedgerData = { type: 'year', year: y, data: JSON.parse(JSON.stringify(state.years[y])) };
    delete state.years[y];
    state.currentYear = Object.keys(state.years)[0]; 
    save(); render();
  });

  document.getElementById('delMonthBtn').addEventListener('click', function() {
    const y = state.currentYear, m = state.currentMonth;
    if (Object.keys(state.years[y]).length <= 1 && Object.keys(state.years).length <= 1) {
      return alert('至少要保留一个月账本');
    }
    if (!confirm(`确定要删除 ${y}年${m}月 的账本吗？`)) return;
    if (!confirm(`【二次确认】该月的所有账目将被清空，确定继续吗？`)) return;
    
    deletedLedgerData = { type: 'month', year: y, month: m, data: JSON.parse(JSON.stringify(state.years[y][m])) };
    delete state.years[y][m];
    
    if (m > 1) state.currentMonth = m - 1;
    else {
      if (Object.keys(state.years).length > 1) {
        delete state.years[y]; 
        state.currentYear = Object.keys(state.years)[0];
        state.currentMonth = 12;
      } else {
        state.currentMonth = 1;
      }
    }
    save(); render();
  });

  document.getElementById('undoLedgerBtn').addEventListener('click', function() {
    if (!deletedLedgerData) return;
    if (deletedLedgerData.type === 'year') {
      state.years[deletedLedgerData.year] = deletedLedgerData.data;
      state.currentYear = deletedLedgerData.year;
    } else if (deletedLedgerData.type === 'month') {
      if (!state.years[deletedLedgerData.year]) state.years[deletedLedgerData.year] = {};
      state.years[deletedLedgerData.year][deletedLedgerData.month] = deletedLedgerData.data;
      state.currentYear = deletedLedgerData.year;
      state.currentMonth = deletedLedgerData.month;
    }
    deletedLedgerData = null;
    save(); render();
  });

  document.getElementById('addEmojiBtn').addEventListener('click', function() {
    if (isDelEmojiMode) return alert('请先取消删除模式');
    const newTag = prompt('请输入新的标签名称（可以带 Emoji）:');
    if (newTag && newTag.trim()) {
      state.emojis.push(newTag.trim());
      save(); render();
    }
  });

  document.getElementById('toggleDelEmojiBtn').addEventListener('click', function() {
    isDelEmojiMode = !isDelEmojiMode;
    if (!isDelEmojiMode) deletedEmojiDataStack = []; 
    render(); 
  });

  document.getElementById('undoEmojiBtn').addEventListener('click', function() {
    if (deletedEmojiDataStack.length === 0) return;
    const action = deletedEmojiDataStack.pop();
    state.emojis.splice(action.index, 0, action.text);
    save(); render();
  });

  document.getElementById('modeEditBtn').addEventListener('click', function() {
    currentMode = 'edit'; render();
  });
  document.getElementById('modeDelBtn').addEventListener('click', function() {
    currentMode = 'delete'; render();
  });
  document.getElementById('modeSortBtn').addEventListener('click', function() {
    currentMode = 'sort'; deletedRowDataStack = []; render();
  });

  document.getElementById('undoRowBtn').addEventListener('click', function() {
    if (deletedRowDataStack.length === 0) return;
    const action = deletedRowDataStack.pop();
    const ledger = getLedger();
    if (action.type === 'parent') {
      ledger.rows.splice(action.parentIndex, 0, action.data);
    } else if (action.type === 'child') {
      const parentRow = ledger.rows[action.parentIndex];
      if (parentRow && parentRow.children) {
        parentRow.children.splice(action.childIndex, 0, action.data);
        parentRow.isExpanded = true;
      }
    }
    save(); render();
  });

  document.getElementById('addRowBtn').addEventListener('click', function() {
    if (currentMode !== 'edit') return;
    const ledger = getLedger();
    const cells = new Array(ledger.columns.length).fill('');
    ledger.rows.push({ cells, children: [], isExpanded: false });
    save(); render();
  });

  document.getElementById('addColBtn').addEventListener('click', function() {
    if (currentMode !== 'edit') return;
    const ledger = getLedger();
    ledger.columns.push('新列');
    ledger.rows.forEach(row => {
      row.cells.push('');
      if (row.children) row.children.forEach(c => c.cells.push(''));
    });
    save(); render();
  });

  document.getElementById('clearBtn').addEventListener('click', function() {
    if (currentMode !== 'edit') return;
    if (!confirm('确定清空本账本所有数据吗？此操作不可撤销。')) return;
    state.years[state.currentYear][state.currentMonth] = JSON.parse(JSON.stringify(DEFAULT_LEDGER_DATA));
    deletedRowDataStack = [];
    save(); render();
  });

  // ====== 数据工具下拉菜单 ======
  const dataToolBtn = document.getElementById('dataToolBtn');
  const dataToolMenu = document.getElementById('dataToolMenu');
  
  dataToolBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    dataToolMenu.classList.toggle('show');
  });

  dataToolMenu.addEventListener('click', function(e) {
    e.stopPropagation(); 
  });

  document.addEventListener('click', function(e) {
    if (!dataToolMenu.contains(e.target) && e.target !== dataToolBtn) {
      dataToolMenu.classList.remove('show');
    }
  });

  // ====== 导出与备份功能 ======
  const exportModal = document.getElementById('exportModal');
  const closeExportBtn = document.getElementById('closeExportBtn');
  const copyTableBtn = document.getElementById('copyTableBtn');
  const copyJsonBtn = document.getElementById('copyJsonBtn');

  closeExportBtn.addEventListener('click', () => exportModal.classList.remove('show'));
  exportModal.addEventListener('click', (e) => {
    if (e.target === exportModal) exportModal.classList.remove('show');
  });

  // ====== 导入功能 ======
  const importModal = document.getElementById('importModal');
  const closeImportBtn = document.getElementById('closeImportBtn');
  const importTextarea = document.getElementById('importTextarea');
  const confirmImportBtn = document.getElementById('confirmImportBtn');
  const importDataBtn = document.getElementById('importDataBtn');

  importDataBtn.addEventListener('click', function() {
    dataToolMenu.classList.remove('show');
    importTextarea.value = ''; // 清空之前的输入
    importModal.classList.add('show');
  });

  closeImportBtn.addEventListener('click', () => importModal.classList.remove('show'));
  importModal.addEventListener('click', (e) => {
    if (e.target === importModal) importModal.classList.remove('show');
  });

  confirmImportBtn.addEventListener('click', function() {
    const text = importTextarea.value.trim();
    if (!text) return alert('请先粘贴备份数据！');

    try {
      const parsed = JSON.parse(text);
      
      // 简单校验数据结构
      if (!parsed.currentYear || !parsed.years) {
        throw new Error('数据格式不正确');
      }

      if (!confirm('⚠️ 确定要覆盖当前所有账本数据吗？此操作无法撤销！')) return;

      // 覆盖状态并补齐可能缺失的字段
      state = parsed;
      if (!state.emojis) state.emojis = [...DEFAULT_EMOJIS];
      
      // 清理可能残留的删除记录
      deletedRowDataStack = [];
      deletedLedgerData = null;
      deletedEmojiDataStack = [];

      save();
      render();
      
      alert('✅ 导入成功！数据已恢复。');
      importModal.classList.remove('show');

    } catch (err) {
      alert('❌ 导入失败：粘贴的文本不是有效的 JSON 数据，请检查是否复制完整。');
    }
  });


  // 复制为 HTML 表格 (粘贴到 Excel)
  copyTableBtn.addEventListener('click', function() {
    const ledger = getLedger();
    const amtIdx = amountColumnIndex(ledger);
    
    // 生成 HTML 表格，带上必要的样式，方便直接粘贴到 Excel 中
    let html = '<table border="1" style="border-collapse: collapse; text-align: left;">';
    // 表头
    html += '<tr>';
    ledger.columns.forEach(col => { html += `<th style="padding: 5px; background-color: #f0f0f0;">${col}</th>`; });
    html += '</tr>';
    
    // 数据行
    ledger.rows.forEach(row => {
      const parentCells = [...row.cells];
      if (row.children && row.children.length > 0) {
        parentCells[amtIdx] = getRowAmount(row, amtIdx);
      }
      
      // 父行
      html += '<tr>';
      parentCells.forEach(c => { html += `<td style="padding: 5px;">${c || ''}</td>`; });
      html += '</tr>';
      
      // 子行
      if (row.children && row.children.length > 0) {
        row.children.forEach(child => {
          html += '<tr>';
          child.cells.forEach((c, i) => { 
            let text = c || '';
            if (i === 0) text = "└ " + text; // 加个前缀标识
            html += `<td style="padding: 5px; color: #666;">${text}</td>`; 
          });
          html += '</tr>';
        });
      }
    });
    html += '</table>';

    // 核心：同时向剪贴板写入 text/html 和 text/plain，这样粘贴到 Excel 就是表格，粘贴到 txt 就是纯文本
    const textVersion = ledger.columns.join('\t') + '\n' + 
      ledger.rows.map(r => r.cells.join('\t')).join('\n');

    try {
      const clipboardItem = new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([textVersion], { type: 'text/plain' })
      });
      
      navigator.clipboard.write([clipboardItem]).then(() => {
        this.textContent = '✅ 已复制！去 Excel 粘贴吧';
        setTimeout(() => { this.textContent = '📊 复制为表格 (直接粘贴进 Excel)'; exportModal.classList.remove('show'); }, 2000);
      }).catch(err => {
        fallbackCopy(html);
      });
    } catch (err) {
      fallbackCopy(html);
    }

    function fallbackCopy(htmlStr) {
      // 针对不支持 ClipboardItem 的老浏览器
      const el = document.createElement('div');
      el.innerHTML = htmlStr;
      el.style.position = 'fixed';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      
      try {
        document.execCommand('copy');
        this.textContent = '✅ 已复制！去 Excel 粘贴吧';
        setTimeout(() => { this.textContent = '📊 复制为表格 (直接粘贴进 Excel)'; exportModal.classList.remove('show'); }, 2000);
      } catch (e) {
        alert('复制失败，请检查浏览器权限');
      }
      
      document.body.removeChild(el);
    }
  });

  // 复制 JSON 备份
  copyJsonBtn.addEventListener('click', function() {
    const jsonStr = JSON.stringify(state);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(jsonStr).then(() => {
        this.textContent = '✅ JSON 备份已复制到剪贴板';
        setTimeout(() => { this.textContent = '📝 复制纯文本备份 (JSON格式)'; exportModal.classList.remove('show'); }, 2000);
      }).catch(() => {
        fallbackCopyText(jsonStr);
      });
    } else {
      fallbackCopyText(jsonStr);
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        this.textContent = '✅ JSON 备份已复制到剪贴板';
        setTimeout(() => { this.textContent = '📝 复制纯文本备份 (JSON格式)'; exportModal.classList.remove('show'); }, 2000);
      } catch (err) {
        alert("复制失败，请手动选择复制");
      }
      document.body.removeChild(textArea);
    }
  });

  document.getElementById('exportDataBtn').addEventListener('click', function() {
    dataToolMenu.classList.remove('show');
    exportModal.classList.add('show');
  });

  // ====== 报表渲染（纯 CSS 极简图表） ======
  const reportModal = document.getElementById('reportModal');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const reportBody = document.getElementById('reportBody');
  const modalTitle = document.getElementById('modalTitle');
  const cssChartContainer = document.getElementById('cssChartContainer');

  closeModalBtn.addEventListener('click', () => { reportModal.classList.remove('show'); });
  reportModal.addEventListener('click', (e) => { 
    if (e.target === reportModal) reportModal.classList.remove('show');
  });

  function generateCSSChart(dataArray) {
    if (dataArray.length === 0) return '';
    const maxVal = Math.max(...dataArray.map(item => item.value));
    if (maxVal === 0) return '';

    let html = '';
    dataArray.forEach((item, index) => {
      const percent = (item.value / maxVal) * 100;
      const color = COLORS[index % COLORS.length];
      html += `
        <div class="chart-row">
          <div class="chart-label">
            <span>${item.label}</span>
            <span>¥ ${item.value % 1 === 0 ? item.value : item.value.toFixed(2)}</span>
          </div>
          <div class="chart-track">
            <div class="chart-fill" style="width: ${percent}%; background-color: ${color};"></div>
          </div>
        </div>
      `;
    });
    return html;
  }

  document.getElementById('monthReportBtn').addEventListener('click', function() {
    dataToolMenu.classList.remove('show');
    const ledger = getLedger();
    const amtIdx = amountColumnIndex(ledger);
    const catIdx = ledger.columns.findIndex(c => c.includes('分类'));
    
    let total = 0;
    let catSummary = {};

    ledger.rows.forEach(row => {
      const items = (row.children && row.children.length > 0) ? row.children : [row];
      items.forEach(item => {
        let val = parseFloat(item.cells[amtIdx]);
        if (!isNaN(val)) {
          total += val;
          let catName = catIdx >= 0 ? (item.cells[catIdx] || row.cells[catIdx] || '未分类') : '未分类';
          catSummary[catName] = (catSummary[catName] || 0) + val;
        }
      });
    });

    const sortedCats = Object.entries(catSummary).sort((a, b) => b[1] - a[1]);
    modalTitle.textContent = `📈 ${state.currentYear}年${state.currentMonth}月 报表`;

    const chartData = sortedCats.map(item => ({ label: item[0], value: item[1] }));
    cssChartContainer.innerHTML = generateCSSChart(chartData);

    let html = '';
    if (sortedCats.length === 0) {
      html = '<div style="text-align:center; color:#9aaac9; padding: 2rem 0;">本月暂无数据</div>';
    } else {
      sortedCats.forEach(([cat, amount]) => {
        html += `<div class="report-item"><span>${cat}</span><span>¥ ${amount % 1 === 0 ? amount : amount.toFixed(2)}</span></div>`;
      });
      html += `<div class="report-total">总计：¥ ${total % 1 === 0 ? total : total.toFixed(2)}</div>`;
    }
    reportBody.innerHTML = html;
    
    reportModal.classList.add('show');
  });

  document.getElementById('yearReportBtn').addEventListener('click', function() {
    dataToolMenu.classList.remove('show');
    const y = state.currentYear;
    const yearData = state.years[y] || {};
    
    let yearTotal = 0;
    let monthSummary = [];

    for (let m = 1; m <= 12; m++) {
      let monthSum = 0;
      if (yearData[m]) {
        const ledger = yearData[m];
        const amtIdx = amountColumnIndex(ledger);
        ledger.rows.forEach(row => {
          monthSum += getRowAmount(row, amtIdx);
        });
      }
      yearTotal += monthSum;
      monthSummary.push({ month: m, amount: monthSum });
    }

    modalTitle.textContent = `📅 ${y}年 报表`;

    const chartData = monthSummary
      .filter(item => item.amount > 0)
      .map(item => ({ label: `${item.month} 月`, value: item.amount }));
      
    cssChartContainer.innerHTML = generateCSSChart(chartData);

    let html = '';
    const activeMonths = monthSummary.filter(item => item.amount > 0);
    if (activeMonths.length === 0) {
      html = '<div style="text-align:center; color:#9aaac9; padding: 2rem 0;">本年度暂无数据</div>';
    } else {
      activeMonths.forEach(item => {
        html += `<div class="report-item"><span>${item.month} 月</span><span>¥ ${item.amount % 1 === 0 ? item.amount : item.amount.toFixed(2)}</span></div>`;
      });
      html += `<div class="report-total">全年总计：¥ ${yearTotal % 1 === 0 ? yearTotal : yearTotal.toFixed(2)}</div>`;
    }
    reportBody.innerHTML = html;
    
    reportModal.classList.add('show');
  });

  render();
})();
</script>
</body>
</html>
