<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简记账 · Asakim</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fb;
      color: #1e2b4f;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: #6b7b9e; margin-top: 0.4rem; font-size: 0.95rem; }
    .back-link {
      display: inline-block; margin-bottom: 1rem; color: #6b7b9e;
      text-decoration: none; font-size: 0.9rem;
    }
    .back-link:hover { color: #1e2b4f; }

    .card {
      background: white; border-radius: 20px; padding: 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      border: 1px solid #e6ecf5; margin-bottom: 1.5rem;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;}
    .card-title { font-size: 1.1rem; font-weight: 600; }

    /* 账本导航栏 */
    .ledger-nav {
      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
    }
    .select-box {
      border: 1px solid #e6ecf5; background: #f9fbfe; border-radius: 12px;
      padding: 0.45rem 0.8rem; font-family: inherit; font-size: 0.9rem;
      color: #1e2b4f; outline: none; cursor: pointer; transition: all 0.2s;
    }
    .select-box:hover { background: #edf2fa; border-color: #b7c9e8; }

    /* 工具栏 */
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
    .btn {
      border: 1px solid #e6ecf5; background: #f9fbfe; color: #1e2b4f;
      border-radius: 12px; padding: 0.35rem 0.75rem; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s ease; font-family: inherit;
      display: flex; align-items: center; gap: 0.3rem; white-space: nowrap;
    }
    .btn:hover { background: #edf2fa; border-color: #b7c9e8; }
    .btn-primary { background: #1e2b4f; color: white; border-color: #1e2b4f; }
    .btn-danger { background: #fdf0ef; color: #c0392b; border-color: #e8c4c0; }
    .btn-danger:hover { background: #fbe4e2; }
    
    /* 模式按钮 */
    .btn-mode-active { background: #fdf0ef; color: #c0392b; border-color: #e8c4c0; }
    .btn-edit-active { background: #1e2b4f; color: white; border-color: #1e2b4f; }

    /* Emoji 快捷面板 */
    .emoji-panel { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; min-height: 30px; }
    .emoji-chip {
      border: 1px solid #e6ecf5; background: white; border-radius: 10px;
      padding: 0.3rem 0.55rem; font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s ease; font-family: inherit; color: #1e2b4f;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .emoji-chip:hover { background: #edf2fa; border-color: #b7c9e8; }
    
    /* 删除模式下的 Emoji 标签 */
    .emoji-chip.delete-mode { border-color: #e8c4c0; background: #fdf0ef; color: #c0392b; cursor: crosshair; }
    .emoji-chip.delete-mode:hover { background: #fbe4e2; }
    .emoji-chip .del-x { font-size: 0.7rem; opacity: 0.6; }

    /* 表格 */
    .table-wrap { overflow-x: auto; margin-bottom: 1rem; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; table-layout: auto; }
    
    th, td { 
      padding: 0.6rem 0.4rem; 
      border-bottom: 1px solid #eef2f8; 
      text-align: left; 
      vertical-align: middle; 
      font-size: 0.9rem; 
      word-break: break-word; 
      position: relative;
      min-width: 50px;
    }
    
    th { font-weight: 600; font-size: 0.85rem; color: #6b7b9e; padding-bottom: 0.6rem; }
    
    /* 单元格 */
    td[contenteditable="true"] { outline: none; border-radius: 8px; transition: background 0.15s ease; padding: 4px; }
    td[contenteditable="true"]:focus { background: #f0f4fb; }
    td[contenteditable="false"] { cursor: default; }
    
    /* 自动计算的金额列样式 */
    td.auto-amount { color: #6b7b9e; font-weight: 500; background: #f9fbfe; }

    /* 操作列 */
    .action-col { width: 44px; padding: 4px 0; text-align: center; }
    
    /* 展开/收起按钮 */
    .btn-toggle {
      background: transparent; border: none; color: #6b7b9e; cursor: pointer;
      font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; transition: background 0.2s;
    }
    .btn-toggle:hover { background: #edf2fa; color: #1e2b4f; }

    /* 删除按钮 */
    .action-btn-del {
      border: none; background: transparent; color: #c0392b; cursor: pointer;
      font-size: 1.1rem; padding: 0.2rem; line-height: 1;
      border-radius: 50%;
    }
    .action-btn-del:hover { background: #fdf0ef; }

    /* 表头列删除 */
    .col-del-btn {
      color: #c0392b; background: #fdf0ef; border: none; border-radius: 4px;
      font-size: 0.7rem; cursor: pointer; padding: 2px 5px;
      margin-left: 4px; vertical-align: middle; display: inline-block;
    }

    /* ===== 子账单（明细）专属样式 ===== */
    .child-row { background: #fafbfc; }
    .child-row td { border-bottom: 1px dashed #eef2f8; }
    .tree-indent { color: #b7c9e8; padding-right: 4px; user-select: none; }
    
    .add-child-row td { text-align: left; border-bottom: 1px solid #eef2f8; }
    .btn-text-add {
      background: transparent; border: none; color: #6b7b9e; font-size: 0.8rem;
      cursor: pointer; padding: 4px 8px; border-radius: 4px;
    }
    .btn-text-add:hover { color: #1e2b4f; background: #edf2fa; }

    /* 日期选择器样式 */
    .child-date-input {
      border: 1px solid transparent; border-radius: 6px; padding: 4px;
      font-family: inherit; font-size: 0.85rem; color: #1e2b4f;
      background: transparent; width: 100%; min-width: 110px;
    }
    .child-date-input:focus { background: #f0f4fb; border-color: #b7c9e8; outline: none; }
    .child-date-input:disabled { color: #9aaac9; }

    /* 总计 */
    .total-bar {
      display: flex; justify-content: flex-end; align-items: baseline; gap: 0.6rem;
      padding-top: 0.8rem; border-top: 2px solid #eef2f8; font-size: 1rem;
    }
    .total-amount { font-size: 1.4rem; font-weight: 700; color: #1e2b4f; }
    .empty-hint { color: #9aaac9; font-size: 0.9rem; text-align: center; padding: 2rem 0; }
    footer { text-align: center; margin-top: 2rem; color: #9aaac9; font-size: 0.85rem; }

    /* ===== 手机端适配 ===== */
    @media (max-width: 600px) {
      body { padding: 1rem 0.5rem; }
      .card { padding: 1rem; border-radius: 16px; }
      .toolbar > span[style*="flex:1"] { display: none; }
      .toolbar { gap: 0.4rem; }
      .btn { padding: 0.35rem 0.5rem; font-size: 0.8rem; }
      .select-box { padding: 0.4rem 0.5rem; font-size: 0.8rem; }
      th, td { padding: 0.5rem 0.3rem; font-size: 0.85rem; }
      
      /* 固定第一列 */
      th:first-child, td:first-child {
        position: sticky; left: 0; background: white; z-index: 2;
        box-shadow: 2px 0 4px -2px rgba(0,0,0,0.05);
      }
      th:first-child { z-index: 3; }
      .child-row td:first-child { background: #fafbfc; }
    }
  </style>
</head>
<body>
<div class="container">
  <a class="back-link" href="../">← 返回工具箱</a>
  <header>
    <h1>📒 极简记账</h1>
    <p>支持分项记录，自动汇总计算</p>
  </header>

  <!-- 账本导航 -->
  <div class="card">
    <div class="ledger-nav">
      <select id="yearSelect" class="select-box"></select>
      <select id="monthSelect" class="select-box"></select>
      <button class="btn" id="addYearBtn">＋ 年</button>
      <button class="btn btn-danger" id="delYearBtn">✕ 删年</button>
      <button class="btn" id="addMonthBtn">＋ 月</button>
      <button class="btn btn-danger" id="delMonthBtn">✕ 删月</button>
      
      <button class="btn" id="undoLedgerBtn" style="display:none; margin-left: auto; color: #c0392b; background: #fdf0ef;">↩️ 撤销删账本</button>
    </div>
  </div>

  <!-- 分类面板 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">🍽️ 分类快捷填入</div>
      <div class="toolbar" style="margin-bottom: 0;">
        <button class="btn" id="addEmojiBtn">＋ 标签</button>
        <button class="btn btn-danger" id="toggleDelEmojiBtn">✕ 删标签</button>
        <button class="btn" id="undoEmojiBtn" style="display:none;">↩️ 撤销</button>
      </div>
    </div>
    <div class="emoji-panel" id="emojiPanel"></div>
  </div>

  <!-- 账目表格 -->
  <div class="card">
    <div class="toolbar">
      <button class="btn btn-edit-active" id="toggleModeBtn">✏️ 记账模式</button>
      <button class="btn" id="undoRowBtn" style="display:none;">↩️ 撤销删行</button>
      <span style="flex:1"></span>
      <button class="btn btn-primary" id="addRowBtn">＋ 行</button>
      <button class="btn" id="addColBtn">＋ 列</button>
      <button class="btn btn-danger" id="clearBtn">清空</button>
    </div>
    <div class="table-wrap">
      <table id="ledgerTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="total-bar">
      <span style="color:#6b7b9e;">本月总计</span>
      <span class="total-amount" id="totalDisplay">0</span>
    </div>
  </div>

  <footer>数据保存在本机浏览器中 · Asakim 工具箱</footer>
</div>

<script>
(function() {
  const STORAGE_KEY = 'asakim_ledger_v3';

  const DEFAULT_LEDGER_DATA = {
    columns: ['日期', '分类', '名称', '金额'],
    rows: [
      { cells: ['', '🍚 早餐', '豆浆油条', '8'], children: [], isExpanded: false },
      { cells: ['', '🍜 午餐', '牛肉面', '22'], children: [], isExpanded: false }
    ]
  };

  const DEFAULT_EMOJIS = [
    '🍚 早餐', '🍜 午餐', '🍽️ 晚餐', '🧋 奶茶', '☕ 咖啡',
    '🚌 交通', '🛒 购物', '🏠 房租', '💡 水电', '📱 话费',
    '🎮 游戏', '📚 书籍', '💊 医疗', '🎁 礼物', '✈️ 旅行'
  ];

  function getTodayStr() {
    const today = new Date();
    return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  }

  function getInitState() {
    const today = new Date();
    const y = today.getFullYear();
    const m = today.getMonth() + 1;
    return {
      currentYear: y,
      currentMonth: m,
      emojis: [...DEFAULT_EMOJIS],
      years: {
        [y]: {
          [m]: JSON.parse(JSON.stringify(DEFAULT_LEDGER_DATA))
        }
      }
    };
  }

  let state = load();
  let isDeleteMode = false;
  let isDelEmojiMode = false;
  let deletedRowData = null; // 统一记录删除的父行或子行
  let deletedLedgerData = null; 
  let deletedEmojiData = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.currentYear && parsed.years) {
          if (!parsed.emojis) parsed.emojis = [...DEFAULT_EMOJIS];
          return parsed;
        }
      }
    } catch (e) {}
    
    try {
      const oldRaw = localStorage.getItem('asakim_ledger_v2');
      if (oldRaw) {
        const oldParsed = JSON.parse(oldRaw);
        if (oldParsed.columns && oldParsed.rows) {
           const init = getInitState();
           init.years[init.currentYear][init.currentMonth] = oldParsed;
           return init;
        }
      }
    } catch(e) {}

    return getInitState();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getLedger() {
    const y = state.currentYear;
    const m = state.currentMonth;
    if (!state.years[y]) state.years[y] = {};
    if (!state.years[y][m]) {
      state.years[y][m] = JSON.parse(JSON.stringify(DEFAULT_LEDGER_DATA));
    }
    return state.years[y][m];
  }

  function render() {
    renderNav();
    renderHead();
    renderBody();
    renderTotal();
    renderEmojiPanel();
    updateToolbar();
  }

  function renderNav() {
    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    
    yearSelect.innerHTML = '';
    if (!state.years[state.currentYear]) state.years[state.currentYear] = {};
    
    const years = Object.keys(state.years).sort((a,b) => b - a);
    if (!years.includes(state.currentYear.toString())) {
      years.push(state.currentYear.toString());
      years.sort((a,b) => b - a);
    }

    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y + ' 年';
      if (parseInt(y) === state.currentYear) opt.selected = true;
      yearSelect.appendChild(opt);
    });

    monthSelect.innerHTML = '';
    for (let i = 1; i <= 12; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i + ' 月';
      if (i === state.currentMonth) opt.selected = true;
      monthSelect.appendChild(opt);
    }

    document.getElementById('undoLedgerBtn').style.display = deletedLedgerData ? 'inline-block' : 'none';
  }

  // ===== 更新工具栏状态 =====
  function updateToolbar() {
    const modeBtn = document.getElementById('toggleModeBtn');
    const undoRowBtn = document.getElementById('undoRowBtn');
    
    if (isDeleteMode) {
      modeBtn.innerHTML = '🗑️ 删除模式';
      modeBtn.className = 'btn btn-mode-active';
      
      if (deletedRowData) {
        undoRowBtn.style.display = 'flex';
        // 根据类型改变撤销按钮文字
        undoRowBtn.innerHTML = deletedRowData.type === 'parent' ? '↩️ 撤销删大类' : '↩️ 撤销删明细';
      } else {
        undoRowBtn.style.display = 'none';
      }
    } else {
      modeBtn.innerHTML = '✏️ 记账模式';
      modeBtn.className = 'btn btn-edit-active';
      undoRowBtn.style.display = 'none';
    }
    
    const delEmojiBtn = document.getElementById('toggleDelEmojiBtn');
    const undoEmojiBtn = document.getElementById('undoEmojiBtn');
    if (isDelEmojiMode) {
      delEmojiBtn.innerHTML = '✕ 取消删标签';
      delEmojiBtn.className = 'btn btn-mode-active';
      undoEmojiBtn.style.display = deletedEmojiData ? 'flex' : 'none';
    } else {
      delEmojiBtn.innerHTML = '✕ 删标签';
      delEmojiBtn.className = 'btn btn-danger';
      undoEmojiBtn.style.display = 'none';
    }
  }

  function renderEmojiPanel() {
    const panel = document.getElementById('emojiPanel');
    panel.innerHTML = '';
    state.emojis.forEach((text, index) => {
      const chip = document.createElement('button');
      chip.className = 'emoji-chip' + (isDelEmojiMode ? ' delete-mode' : '');
      
      if (isDelEmojiMode) {
        chip.innerHTML = `<span>${text}</span><span class="del-x">✕</span>`;
        chip.addEventListener('click', function() {
          if (!confirm(`确定要删除标签【${text}】吗？`)) return;
          deletedEmojiData = { index: index, text: text };
          state.emojis.splice(index, 1);
          save(); render();
        });
      } else {
        chip.textContent = text;
        chip.addEventListener('click', function() {
          if (isDeleteMode) return alert('请先切换到记账模式');
          const active = window._activeCell;
          if (active && active.el) {
            active.el.textContent = text;
            const ledger = getLedger();
            if (active.isChild) {
              ledger.rows[active.ri].children[active.cIdx].cells[active.ci] = text;
              if (active.ci === amountColumnIndex()) {
                updateParentAmountDisplay(active.ri);
                renderTotal();
              }
            } else {
              ledger.rows[active.ri].cells[active.ci] = text;
              renderTotal();
            }
            save();
          } else {
            alert('请先点击表格中的一个单元格，再选择分类。');
          }
        });
      }
      panel.appendChild(chip);
    });
  }

  function renderHead() {
    const ledger = getLedger();
    const thead = document.getElementById('tableHead');
    thead.innerHTML = '';
    const tr = document.createElement('tr');
    
    ledger.columns.forEach((col, ci) => {
      const th = document.createElement('th');
      
      if (!isDeleteMode) {
        th.textContent = col;
        th.setAttribute('contenteditable', 'true');
        th.style.outline = 'none';
        
        th.addEventListener('input', function() {
          ledger.columns[ci] = this.textContent;
          save();
        });
        
        th.addEventListener('blur', function() {
          if (this.textContent.trim() === '') {
            this.textContent = '未命名';
            ledger.columns[ci] = '未命名';
          } else {
            ledger.columns[ci] = this.textContent.trim();
          }
          save(); renderTotal();
        });
      } else {
        th.style.cursor = 'default';
        const textSpan = document.createElement('span');
        textSpan.textContent = col;
        textSpan.style.display = 'inline-block';
        th.appendChild(textSpan);
        
        const colDelBtn = document.createElement('button');
        colDelBtn.className = 'col-del-btn';
        colDelBtn.textContent = '✕';
        colDelBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if(!confirm('确定删除此列吗？')) return;
          ledger.columns.splice(ci, 1);
          ledger.rows.forEach(r => {
            r.cells.splice(ci, 1);
            if (r.children) r.children.forEach(c => c.cells.splice(ci, 1));
          });
          save(); render();
        });
        th.appendChild(colDelBtn);
      }
      tr.appendChild(th);
    });
    
    const thOp = document.createElement('th');
    thOp.className = 'action-col';
    tr.appendChild(thOp);
    thead.appendChild(tr);
  }

  function renderBody() {
    const ledger = getLedger();
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    if (ledger.rows.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = ledger.columns.length + 1;
      td.className = 'empty-hint';
      td.textContent = '本月还没有账目，点击上方「＋ 行」开始记录。';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    const amtIdx = amountColumnIndex();
    const dateColIdx = ledger.columns.findIndex(c => c.includes('日期'));
    const todayStr = getTodayStr();

    ledger.rows.forEach((row, ri) => {
      const tr = document.createElement('tr');
      while (row.cells.length < ledger.columns.length) row.cells.push('');

      const hasChildren = row.children && row.children.length > 0;
      
      let autoSum = 0;
      if (hasChildren) {
        row.children.forEach(c => {
          let val = parseFloat(c.cells[amtIdx]);
          if (!isNaN(val)) autoSum += val;
        });
      }

      row.cells.forEach((cellVal, ci) => {
        const td = document.createElement('td');
        const isAutoAmount = (ci === amtIdx && hasChildren);
        
        if (!isDeleteMode && !isAutoAmount) {
          td.setAttribute('contenteditable', 'true');
          td.addEventListener('input', function() {
            row.cells[ci] = this.textContent;
            save();
            if (ci === amtIdx) renderTotal();
          });
          td.addEventListener('click', function() {
            window._activeCell = { ri, ci, el: this, isChild: false };
          });
        } else {
          td.setAttribute('contenteditable', 'false');
        }
        
        if (isAutoAmount) {
          td.textContent = autoSum % 1 === 0 ? autoSum.toString() : autoSum.toFixed(2);
          td.className = 'auto-amount';
        } else {
          td.textContent = cellVal;
        }
        
        tr.appendChild(td);
      });

      const tdOp = document.createElement('td');
      tdOp.className = 'action-col';
      
      if (!isDeleteMode) {
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'btn-toggle';
        toggleBtn.textContent = row.isExpanded ? '▼' : '▶';
        toggleBtn.addEventListener('click', function() {
          row.isExpanded = !row.isExpanded;
          save(); render();
        });
        tdOp.appendChild(toggleBtn);
      } else {
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn-del';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => {
          // 记录删除的大类
          deletedRowData = { type: 'parent', parentIndex: ri, data: JSON.parse(JSON.stringify(row)) };
          ledger.rows.splice(ri, 1);
          save(); render();
        });
        tdOp.appendChild(delBtn);
      }

      tr.appendChild(tdOp);
      tbody.appendChild(tr);

      if (row.isExpanded) {
        if (dateColIdx > -1 && row.children.length > 1) {
          row.children.sort((a, b) => {
            let d1 = a.cells[dateColIdx] || '';
            let d2 = b.cells[dateColIdx] || '';
            return d2.localeCompare(d1);
          });
        }

        row.children.forEach((child, cIdx) => {
          const childTr = document.createElement('tr');
          childTr.className = 'child-row';
          while (child.cells.length < ledger.columns.length) child.cells.push('');

          ledger.columns.forEach((col, ci) => {
            const childTd = document.createElement('td');
            
            if (ci === 0) {
              childTd.innerHTML = '<span class="tree-indent">└</span>';
            } else if (ci === dateColIdx) {
              const dateInput = document.createElement('input');
              dateInput.type = 'date';
              dateInput.className = 'child-date-input';
              dateInput.value = child.cells[ci] || todayStr;
              if (!child.cells[ci]) child.cells[ci] = todayStr;
              
              if (isDeleteMode) {
                dateInput.disabled = true;
              } else {
                dateInput.addEventListener('change', function() {
                  child.cells[ci] = this.value;
                  save();
                  render(); 
                });
              }
              childTd.appendChild(dateInput);
            } else {
              childTd.textContent = child.cells[ci] || '';
              if (!isDeleteMode) {
                childTd.setAttribute('contenteditable', 'true');
                childTd.addEventListener('input', function() {
                  child.cells[ci] = this.textContent;
                  save();
                  if (ci === amtIdx) {
                    updateParentAmountDisplay(ri);
                    renderTotal();
                  }
                });
                childTd.addEventListener('click', function() {
                  window._activeCell = { ri, ci, el: this, isChild: true, cIdx };
                });
              } else {
                childTd.setAttribute('contenteditable', 'false');
              }
            }
            childTr.appendChild(childTd);
          });

          const childOp = document.createElement('td');
          childOp.className = 'action-col';
          if (isDeleteMode) {
            const delChild = document.createElement('button');
            delChild.className = 'action-btn-del';
            delChild.textContent = '✕';
            delChild.addEventListener('click', () => {
              // 记录删除的明细，记下它在哪个父行下
              deletedRowData = { type: 'child', parentIndex: ri, childIndex: cIdx, data: JSON.parse(JSON.stringify(child)) };
              row.children.splice(cIdx, 1);
              if (row.children.length === 0) row.cells[amtIdx] = '';
              save(); render();
            });
            childOp.appendChild(delChild);
          }
          childTr.appendChild(childOp);
          tbody.appendChild(childTr);
        });

        if (!isDeleteMode) {
          const addTr = document.createElement('tr');
          addTr.className = 'child-row add-child-row';
          const addTd = document.createElement('td');
          addTd.colSpan = ledger.columns.length + 1;
          
          const addBtn = document.createElement('button');
          addBtn.className = 'btn-text-add';
          addBtn.textContent = '＋ 添加明细';
          addBtn.addEventListener('click', () => {
            const emptyCells = new Array(ledger.columns.length).fill('');
            row.children.push({ cells: emptyCells });
            save(); render();
          });
          
          addTd.appendChild(addBtn);
          addTr.appendChild(addTd);
          tbody.appendChild(addTr);
        }
      }
    });
  }

  function updateParentAmountDisplay(ri) {
    const ledger = getLedger();
    const row = ledger.rows[ri];
    const amtIdx = amountColumnIndex();
    let sum = 0;
    row.children.forEach(c => {
      let val = parseFloat(c.cells[amtIdx]);
      if (!isNaN(val)) sum += val;
    });
    
    const tbody = document.getElementById('tableBody');
    const parentTrs = Array.from(tbody.children).filter(tr => !tr.classList.contains('child-row'));
    const currentTr = parentTrs[ri];
    
    if (currentTr) {
      const amountTd = currentTr.children[amtIdx];
      if (amountTd) {
        amountTd.textContent = sum % 1 === 0 ? sum.toString() : sum.toFixed(2);
      }
    }
  }

  function amountColumnIndex() {
    const ledger = getLedger();
    const idx = ledger.columns.findIndex(c => c.includes('金额'));
    return idx >= 0 ? idx : ledger.columns.length - 1;
  }

  function renderTotal() {
    const ledger = getLedger();
    const idx = amountColumnIndex();
    let sum = 0;
    ledger.rows.forEach(row => {
      if (row.children && row.children.length > 0) {
        row.children.forEach(c => {
          let val = parseFloat(c.cells[idx]);
          if (!isNaN(val)) sum += val;
        });
      } else {
        let val = parseFloat(row.cells[idx]);
        if (!isNaN(val)) sum += val;
      }
    });
    document.getElementById('totalDisplay').textContent =
      sum % 1 === 0 ? sum.toString() : sum.toFixed(2);
  }

  // ====== 导航事件 ======
  document.getElementById('yearSelect').addEventListener('change', function() {
    state.currentYear = parseInt(this.value);
    deletedRowData = null; deletedLedgerData = null; 
    save(); render();
  });

  document.getElementById('monthSelect').addEventListener('change', function() {
    state.currentMonth = parseInt(this.value);
    deletedRowData = null; deletedLedgerData = null;
    save(); render();
  });

  document.getElementById('addYearBtn').addEventListener('click', function() {
    const y = prompt('请输入要添加的年份 (如 2024):', new Date().getFullYear() + 1);
    if (!y || isNaN(y)) return;
    const yearNum = parseInt(y);
    if (!state.years[yearNum]) state.years[yearNum] = {};
    state.currentYear = yearNum;
    save(); render();
  });

  document.getElementById('addMonthBtn').addEventListener('click', function() {
    const m = prompt('请输入要添加的月份 (1-12):', new Date().getMonth() + 1);
    if (!m || isNaN(m)) return;
    const monthNum = parseInt(m);
    if (monthNum < 1 || monthNum > 12) return alert('请输入 1-12 之间的数字');
    if (!state.years[state.currentYear][monthNum]) state.years[state.currentYear][monthNum] = {};
    state.currentMonth = monthNum;
    save(); render();
  });

  document.getElementById('delYearBtn').addEventListener('click', function() {
    const y = state.currentYear;
    if (Object.keys(state.years).length <= 1) return alert('至少要保留一个年份');
    if (!confirm(`确定要删除 ${y} 年的所有账本吗？`)) return;
    if (!confirm(`【二次确认】删除后该年份下所有数据将清空，确定继续吗？`)) return;
    
    deletedLedgerData = { type: 'year', year: y, data: JSON.parse(JSON.stringify(state.years[y])) };
    delete state.years[y];
    state.currentYear = Object.keys(state.years)[0]; 
    save(); render();
  });

  document.getElementById('delMonthBtn').addEventListener('click', function() {
    const y = state.currentYear, m = state.currentMonth;
    if (Object.keys(state.years[y]).length <= 1 && Object.keys(state.years).length <= 1) {
      return alert('至少要保留一个月账本');
    }
    if (!confirm(`确定要删除 ${y}年${m}月 的账本吗？`)) return;
    if (!confirm(`【二次确认】该月的所有账目将被清空，确定继续吗？`)) return;
    
    deletedLedgerData = { type: 'month', year: y, month: m, data: JSON.parse(JSON.stringify(state.years[y][m])) };
    delete state.years[y][m];
    
    if (m > 1) state.currentMonth = m - 1;
    else {
      if (Object.keys(state.years).length > 1) {
        delete state.years[y]; 
        state.currentYear = Object.keys(state.years)[0];
        state.currentMonth = 12;
      } else {
        state.currentMonth = 1;
      }
    }
    save(); render();
  });

  document.getElementById('undoLedgerBtn').addEventListener('click', function() {
    if (!deletedLedgerData) return;
    if (deletedLedgerData.type === 'year') {
      state.years[deletedLedgerData.year] = deletedLedgerData.data;
      state.currentYear = deletedLedgerData.year;
    } else if (deletedLedgerData.type === 'month') {
      if (!state.years[deletedLedgerData.year]) state.years[deletedLedgerData.year] = {};
      state.years[deletedLedgerData.year][deletedLedgerData.month] = deletedLedgerData.data;
      state.currentYear = deletedLedgerData.year;
      state.currentMonth = deletedLedgerData.month;
    }
    deletedLedgerData = null;
    save(); render();
  });

  // ====== 标签增删事件 ======
  document.getElementById('addEmojiBtn').addEventListener('click', function() {
    if (isDelEmojiMode) return alert('请先取消删除模式');
    const newTag = prompt('请输入新的标签名称（可以带 Emoji）:');
    if (newTag && newTag.trim()) {
      state.emojis.push(newTag.trim());
      save(); render();
    }
  });

  document.getElementById('toggleDelEmojiBtn').addEventListener('click', function() {
    isDelEmojiMode = !isDelEmojiMode;
    if (!isDelEmojiMode) deletedEmojiData = null; 
    render(); 
  });

  document.getElementById('undoEmojiBtn').addEventListener('click', function() {
    if (!deletedEmojiData) return;
    state.emojis.splice(deletedEmojiData.index, 0, deletedEmojiData.text);
    deletedEmojiData = null;
    save(); render();
  });

  // ====== 表格事件 ======
  document.getElementById('undoRowBtn').addEventListener('click', function() {
    if (!deletedRowData) return;
    const ledger = getLedger();
    
    if (deletedRowData.type === 'parent') {
      // 恢复大类
      ledger.rows.splice(deletedRowData.parentIndex, 0, deletedRowData.data);
    } else if (deletedRowData.type === 'child') {
      // 恢复明细
      const parentRow = ledger.rows[deletedRowData.parentIndex];
      if (parentRow && parentRow.children) {
        parentRow.children.splice(deletedRowData.childIndex, 0, deletedRowData.data);
        parentRow.isExpanded = true; // 自动展开父行以便看到恢复的数据
      }
    }
    
    deletedRowData = null;
    save(); render();
  });

  document.getElementById('toggleModeBtn').addEventListener('click', function() {
    isDeleteMode = !isDeleteMode;
    if (!isDeleteMode) deletedRowData = null;
    render();
  });

  document.getElementById('addRowBtn').addEventListener('click', function() {
    const ledger = getLedger();
    const cells = new Array(ledger.columns.length).fill('');
    ledger.rows.push({ cells, children: [], isExpanded: false });
    save(); render();
  });

  document.getElementById('addColBtn').addEventListener('click', function() {
    const ledger = getLedger();
    ledger.columns.push('新列');
    ledger.rows.forEach(row => {
      row.cells.push('');
      if (row.children) row.children.forEach(c => c.cells.push(''));
    });
    save(); render();
  });

  document.getElementById('clearBtn').addEventListener('click', function() {
    if (!confirm('确定清空本账本所有数据吗？此操作不可撤销。')) return;
    state.years[state.currentYear][state.currentMonth] = JSON.parse(JSON.stringify(DEFAULT_LEDGER_DATA));
    deletedRowData = null;
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
